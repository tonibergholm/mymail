[package]
name = "mymail"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
chrono = "0.4"
dirs = "7.0.0"
encoding_rs = "0.8"
getrandom = "0.3"
gpui-kit = "0.9.1"
gpui-pre-reqwest-client = "=0.3.12"
html2text = "0.17.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
ureq = { version = "3", features = ["json"] }

[target.'cfg(target_os = "macos")'.dependencies]
wry = "0.57"
