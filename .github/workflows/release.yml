name: Release
# Push a tag like v0.2.0 (it must match the version in Cargo.toml) to publish a release.
# The app's updater looks for the asset names below.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            asset: MyMail-macos-arm64.zip
            arch: arm64
          - os: ubuntu-latest
            asset: mymail-linux-x86_64.tar.gz
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "tag $GITHUB_REF_NAME != v$version" >&2; exit 1; }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev \
            libvulkan-dev libfontconfig-dev libfreetype-dev libasound2-dev libssl-dev libzstd-dev
      - name: Runner architecture
        run: '[ "$(uname -m)" = "${{ matrix.arch }}" ]'
      - run: cargo test --locked
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          APP_DIR="$RUNNER_TEMP/out" ./scripts/install.sh
          ditto -c -k --keepParent "$RUNNER_TEMP/out/MyMail.app" "${{ matrix.asset }}"
          # The updater verifies the unpacked bundle the same way.
          mkdir "$RUNNER_TEMP/check" && ditto -x -k "${{ matrix.asset }}" "$RUNNER_TEMP/check"
          codesign --verify --deep --strict "$RUNNER_TEMP/check/MyMail.app"
          "$RUNNER_TEMP/check/MyMail.app/Contents/MacOS/mymail" --version
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --release --locked
          tar -czf "${{ matrix.asset }}" -C target/release mymail
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --repo "$GITHUB_REPOSITORY" --generate-notes --title "$GITHUB_REF_NAME" MyMail-macos-arm64.zip mymail-linux-x86_64.tar.gz
